name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK & Licenses
        run: |
          echo "Setting up Android SDK environment and licenses..."
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd\n8933bad161af4178b1185d1a37fbf41ea5269c55\n" > "$ANDROID_HOME/licenses/android-sdk-license"

          # Accept all licenses
          yes | sdkmanager --licenses || true

          # Install platform 36 if not present
          sdkmanager "platforms;android-36" "build-tools;36.0.0" --channel=3 || true
          sdkmanager "platforms;android-36" || true

      - name: Prepare Environment & Keystore
        run: |
          chmod +x gradlew

          # Reconstruct debug.keystore if base64 encoded copy is present
          if [ -f debug.keystore.base64 ] && [ ! -s debug.keystore ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

          # If debug.keystore is still missing or empty, generate a standard debug keystore
          if [ ! -s debug.keystore ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi

          # Ensure keystore exists both in root and in standard ~/.android for AGP
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore || true

          # Ensure .env exists so Secrets Gradle plugin does not fail
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.configuration-cache=false

      - name: Locate Built APK Files
        id: locate_apk
        run: |
          echo "Listing all generated APK files:"
          find app/build/outputs/apk -type f -name "*.apk" | tee apk_files.txt
          if [ ! -s apk_files.txt ]; then
            echo "ERROR: No APK found after build!"
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BotStudio-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
